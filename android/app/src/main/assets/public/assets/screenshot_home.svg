<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1600" width="800" height="1600">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="heroGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="40%" stop-color="#2563EB" />
      <stop offset="80%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#93C5FD" />
    </linearGradient>

    <!-- Glass Card Gradient -->
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.75)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.85)" />
    </linearGradient>

    <!-- Dock Glass Gradient -->
    <linearGradient id="dockGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(15, 23, 42, 0.72)" />
      <stop offset="100%" stop-color="rgba(2, 6, 23, 0.82)" />
    </linearGradient>

    <!-- Accent Glow -->
    <filter id="mintGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Phone Mockup Frame -->
  <rect x="0" y="0" width="800" height="1600" fill="#000000" />

  <!-- Screen Container -->
  <rect x="20" y="20" width="760" height="1560" rx="48" fill="url(#bgSky)" stroke="#334155" stroke-width="4" />

  <!-- Status Bar & Punch Hole Camera -->
  <circle cx="400" cy="50" r="12" fill="#000000" stroke="#1E293B" stroke-width="2" />
  <text x="60" y="55" fill="#94A3B8" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="20">9:41</text>
  <path d="M 690 45 L 720 45 L 720 58 L 690 58 Z" fill="none" stroke="#94A3B8" stroke-width="2" />
  <rect x="693" y="48" width="20" height="7" fill="#00D284" />

  <!-- Top Navigation Header Bar -->
  <g transform="translate(40, 90)">
    <!-- Location Picker Pill -->
    <rect x="0" y="0" width="280" height="52" rx="20" fill="#1E293B" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" />
    <circle cx="30" cy="26" r="8" fill="#00D284" filter="url(#mintGlow)" />
    <text x="50" y="32" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-weight="800" font-size="22">San Francisco</text>
    <path d="M 240 22 L 250 32 L 260 22" fill="none" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" />

    <!-- Action Buttons -->
    <rect x="580" y="0" width="52" height="52" rx="20" fill="#1E293B" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" />
    <circle cx="606" cy="26" r="10" fill="none" stroke="#F59E0B" stroke-width="3" />

    <rect x="650" y="0" width="52" height="52" rx="20" fill="#1E293B" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" />
    <path d="M 670 18 A 10 10 0 1 1 682 30" fill="none" stroke="#00D284" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Weather Hero Scene Card (Animated Farm Landscape) -->
  <g transform="translate(40, 165)" filter="url(#shadow)">
    <rect x="0" y="0" width="720" height="420" rx="40" fill="url(#heroGradient)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2" />

    <!-- Sun Sphere -->
    <circle cx="600" cy="110" r="55" fill="#FFD000" opacity="0.9" />
    <circle cx="600" cy="110" r="75" fill="#FFD000" opacity="0.25" filter="url(#mintGlow)" />

    <!-- Rolling Hills & Pasture -->
    <path d="M 0 320 Q 200 260, 400 310 T 720 280 L 720 420 L 0 420 Z" fill="#15803D" />
    <path d="M 0 350 Q 300 310, 720 340 L 720 420 L 0 420 Z" fill="#166534" />

    <!-- Red Barn -->
    <rect x="120" y="240" width="110" height="80" fill="#DC2626" rx="4" />
    <polygon points="110,240 175,190 240,240" fill="#991B1B" />
    <rect x="155" y="270" width="40" height="50" fill="#FEF08A" />

    <!-- Silo -->
    <rect x="245" y="210" width="45" height="110" fill="#94A3B8" rx="8" />
    <path d="M 245 210 Q 267.5 185, 290 210 Z" fill="#64748B" />

    <!-- Wind Turbine -->
    <line x1="520" y1="320" x2="520" y2="180" stroke="#FFFFFF" stroke-width="6" />
    <circle cx="520" cy="180" r="10" fill="#FFFFFF" />
    <line x1="520" y1="180" x2="470" y2="140" stroke="#FFFFFF" stroke-width="4" />
    <line x1="520" y1="180" x2="570" y2="140" stroke="#FFFFFF" stroke-width="4" />
    <line x1="520" y1="180" x2="520" y2="240" stroke="#FFFFFF" stroke-width="4" />

    <!-- Temperature & Condition Overlay -->
    <text x="50" y="110" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="100">24°</text>
    <text x="50" y="150" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-weight="800" font-size="28">Partly Cloudy</text>
    <text x="50" y="180" fill="#E2E8F0" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="20">Feels like 23° • H:26° L:18°</text>

    <!-- Live Sync Badge -->
    <rect x="50" y="350" width="160" height="38" rx="19" fill="rgba(0, 0, 0, 0.4)" stroke="rgba(0, 210, 132, 0.6)" stroke-width="1.5" />
    <circle cx="70" cy="369" r="6" fill="#00D284" />
    <text x="86" y="375" fill="#00D284" font-family="'Outfit', sans-serif" font-weight="800" font-size="16">● LIVE SYNC</text>
  </g>

  <!-- AI Smart Weather Briefing Card -->
  <g transform="translate(40, 610)" filter="url(#shadow)">
    <rect x="0" y="0" width="720" height="130" rx="28" fill="url(#glassCard)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />
    <rect x="24" y="24" width="48" height="48" rx="16" fill="rgba(0, 210, 132, 0.2)" />
    <path d="M 48 38 L 52 46 L 60 48 L 52 50 L 48 58 L 44 50 L 36 48 L 44 46 Z" fill="#00D284" />
    <text x="88" y="48" fill="#00D284" font-family="'Outfit', sans-serif" font-weight="800" font-size="20">AI SMART BRIEFING</text>
    <text x="88" y="78" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="18">Optimal agricultural conditions today. Gentle breeze with 68% soil moisture.</text>
    <text x="88" y="104" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="16">No irrigation required until Tuesday evening.</text>
  </g>

  <!-- 24-Hour Hourly Timeline Card -->
  <g transform="translate(40, 760)" filter="url(#shadow)">
    <rect x="0" y="0" width="720" height="210" rx="32" fill="url(#glassCard)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />
    <text x="28" y="44" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-weight="800" font-size="22">24-Hour Hourly Forecast</text>

    <!-- Hourly Nodes -->
    <!-- Now -->
    <rect x="28" y="65" width="120" height="120" rx="20" fill="rgba(0, 210, 132, 0.2)" stroke="#00D284" stroke-width="2" />
    <text x="88" y="95" text-anchor="middle" fill="#00D284" font-family="'Outfit', sans-serif" font-weight="800" font-size="18">Now</text>
    <text x="88" y="132" text-anchor="middle" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="28">24°</text>
    <text x="88" y="165" text-anchor="middle" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14">15% rain</text>

    <!-- 11 AM -->
    <rect x="164" y="65" width="120" height="120" rx="20" fill="rgba(255, 255, 255, 0.05)" />
    <text x="224" y="95" text-anchor="middle" fill="#94A3B8" font-family="'Outfit', sans-serif" font-weight="700" font-size="18">11 AM</text>
    <text x="224" y="132" text-anchor="middle" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="28">25°</text>
    <text x="224" y="165" text-anchor="middle" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14">10% rain</text>

    <!-- 12 PM -->
    <rect x="300" y="65" width="120" height="120" rx="20" fill="rgba(255, 255, 255, 0.05)" />
    <text x="360" y="95" text-anchor="middle" fill="#94A3B8" font-family="'Outfit', sans-serif" font-weight="700" font-size="18">12 PM</text>
    <text x="360" y="132" text-anchor="middle" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="28">26°</text>
    <text x="360" y="165" text-anchor="middle" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14">5% rain</text>

    <!-- 1 PM -->
    <rect x="436" y="65" width="120" height="120" rx="20" fill="rgba(255, 255, 255, 0.05)" />
    <text x="496" y="95" text-anchor="middle" fill="#94A3B8" font-family="'Outfit', sans-serif" font-weight="700" font-size="18">1 PM</text>
    <text x="496" y="132" text-anchor="middle" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="28">26°</text>
    <text x="496" y="165" text-anchor="middle" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14">5% rain</text>

    <!-- 2 PM -->
    <rect x="572" y="65" width="120" height="120" rx="20" fill="rgba(255, 255, 255, 0.05)" />
    <text x="632" y="95" text-anchor="middle" fill="#94A3B8" font-family="'Outfit', sans-serif" font-weight="700" font-size="18">2 PM</text>
    <text x="632" y="132" text-anchor="middle" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="28">25°</text>
    <text x="632" y="165" text-anchor="middle" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14">10% rain</text>
  </g>

  <!-- Conditions Grid (2x2 Cards) -->
  <g transform="translate(40, 990)">
    <!-- Humidity -->
    <rect x="0" y="0" width="345" height="180" rx="28" fill="url(#glassCard)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />
    <text x="24" y="42" fill="#00D284" font-family="'Outfit', sans-serif" font-weight="800" font-size="18">HUMIDITY</text>
    <text x="24" y="100" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="48">68%</text>
    <text x="24" y="140" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="16">Dew point is 17°C</text>

    <!-- Wind -->
    <rect x="375" y="0" width="345" height="180" rx="28" fill="url(#glassCard)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />
    <text x="399" y="42" fill="#0EA5E9" font-family="'Outfit', sans-serif" font-weight="800" font-size="18">WIND SPEED</text>
    <text x="399" y="100" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="48">14 <tspan font-size="24">km/h</tspan></text>
    <text x="399" y="140" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="16">WSW • Gusts up to 20 km/h</text>

    <!-- Barometer -->
    <rect x="0" y="200" width="345" height="180" rx="28" fill="url(#glassCard)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />
    <text x="24" y="242" fill="#8B5CF6" font-family="'Outfit', sans-serif" font-weight="800" font-size="18">PRESSURE</text>
    <text x="24" y="300" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="44">1016 <tspan font-size="20">hPa</tspan></text>
    <text x="24" y="340" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="16">Steady atmospheric pressure</text>

    <!-- UV Index -->
    <rect x="375" y="200" width="345" height="180" rx="28" fill="url(#glassCard)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />
    <text x="399" y="242" fill="#F59E0B" font-family="'Outfit', sans-serif" font-weight="800" font-size="18">UV INDEX</text>
    <text x="399" y="300" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="48">6 <tspan font-size="24">High</tspan></text>
    <text x="399" y="340" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="16">Protection needed 11 AM - 4 PM</text>
  </g>

  <!-- Apple Liquid Glass Floating Navigation Dock -->
  <g transform="translate(60, 1430)" filter="url(#shadow)">
    <rect x="0" y="0" width="680" height="96" rx="48" fill="url(#dockGlass)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="2" />

    <!-- Dock Items -->
    <!-- Tab 1: Weather (Active) -->
    <g transform="translate(30, 16)">
      <rect x="0" y="0" width="100" height="64" rx="32" fill="rgba(0, 210, 132, 0.25)" stroke="#00D284" stroke-width="1.5" />
      <circle cx="50" cy="24" r="10" fill="none" stroke="#00D284" stroke-width="3" />
      <text x="50" y="52" text-anchor="middle" fill="#00D284" font-family="'Outfit', sans-serif" font-weight="900" font-size="15">Weather</text>
    </g>

    <!-- Tab 2: Radar -->
    <g transform="translate(170, 16)">
      <circle cx="50" cy="24" r="10" fill="none" stroke="#94A3B8" stroke-width="2" />
      <text x="50" y="52" text-anchor="middle" fill="#94A3B8" font-family="'Outfit', sans-serif" font-weight="700" font-size="15">Radar</text>
    </g>

    <!-- Tab 3: Air & Sun -->
    <g transform="translate(290, 16)">
      <circle cx="50" cy="24" r="10" fill="none" stroke="#94A3B8" stroke-width="2" />
      <text x="50" y="52" text-anchor="middle" fill="#94A3B8" font-family="'Outfit', sans-serif" font-weight="700" font-size="15">Air &amp; Sun</text>
    </g>

    <!-- Tab 4: Widgets -->
    <g transform="translate(420, 16)">
      <rect x="42" y="16" width="16" height="16" fill="none" stroke="#94A3B8" stroke-width="2" />
      <text x="50" y="52" text-anchor="middle" fill="#94A3B8" font-family="'Outfit', sans-serif" font-weight="700" font-size="15">Widgets</text>
    </g>

    <!-- Tab 5: Settings -->
    <g transform="translate(550, 16)">
      <circle cx="50" cy="24" r="10" fill="none" stroke="#94A3B8" stroke-width="2" />
      <text x="50" y="52" text-anchor="middle" fill="#94A3B8" font-family="'Outfit', sans-serif" font-weight="700" font-size="15">Settings</text>
    </g>
  </g>
</svg>
