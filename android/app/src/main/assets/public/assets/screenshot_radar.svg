<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1600" width="800" height="1600">
  <defs>
    <linearGradient id="bgSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Radar Map Surface -->
    <linearGradient id="mapBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#1C2541" />
    </linearGradient>

    <!-- Doppler Precipitation Heatmap Gradients -->
    <radialGradient id="dopplerLight" cx="40%" cy="45%" r="35%">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#EAB308" stop-opacity="0.75" />
      <stop offset="90%" stop-color="#EF4444" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="dopplerCore" cx="42%" cy="46%" r="18%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#EF4444" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.85)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.95)" />
    </linearGradient>

    <linearGradient id="dockGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(15, 23, 42, 0.72)" />
      <stop offset="100%" stop-color="rgba(2, 6, 23, 0.82)" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Phone Frame -->
  <rect x="0" y="0" width="800" height="1600" fill="#000000" />
  <rect x="20" y="20" width="760" height="1560" rx="48" fill="url(#bgSky)" stroke="#334155" stroke-width="4" />

  <!-- Status Bar -->
  <circle cx="400" cy="50" r="12" fill="#000000" stroke="#1E293B" stroke-width="2" />
  <text x="60" y="55" fill="#94A3B8" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="20">9:41</text>
  <rect x="693" y="48" width="20" height="7" fill="#00D284" />

  <!-- Screen Header -->
  <g transform="translate(40, 95)">
    <rect x="0" y="0" width="52" height="52" rx="20" fill="rgba(14, 165, 233, 0.2)" />
    <circle cx="26" cy="26" r="14" fill="none" stroke="#0EA5E9" stroke-width="3" />
    <text x="70" y="32" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-weight="900" font-size="26">Live Radar &amp; Weather Map</text>
    <text x="70" y="52" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="16">High-definition Doppler precipitation &amp; wind vectors</text>
  </g>

  <!-- Interactive Map Canvas -->
  <g transform="translate(40, 175)" filter="url(#shadow)">
    <rect x="0" y="0" width="720" height="980" rx="40" fill="url(#mapBg)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2" />

    <!-- Map Topographic Grid Lines -->
    <path d="M 0 200 L 720 200 M 0 400 L 720 400 M 0 600 L 720 600 M 0 800 L 720 800" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1.5" />
    <path d="M 180 0 L 180 980 M 360 0 L 360 980 M 540 0 L 540 980" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1.5" />

    <!-- Coastline / Terrain Vectors -->
    <path d="M 100 0 Q 180 250, 120 500 T 220 980" fill="none" stroke="#334155" stroke-width="4" />
    <path d="M 300 100 Q 420 300, 380 600 T 520 980" fill="none" stroke="#334155" stroke-width="3" />

    <!-- Doppler Precipitation Heatmap Overlay -->
    <path d="M 220 180 C 400 120, 580 260, 480 480 C 380 680, 180 520, 220 180 Z" fill="url(#dopplerLight)" filter="blur(16px)" opacity="0.9" />
    <path d="M 280 240 C 420 200, 520 300, 440 440 C 360 560, 240 420, 280 240 Z" fill="url(#dopplerCore)" filter="blur(12px)" />

    <!-- San Francisco Target Pin -->
    <g transform="translate(320, 380)">
      <circle cx="0" cy="0" r="18" fill="rgba(0, 210, 132, 0.3)" />
      <circle cx="0" cy="0" r="8" fill="#00D284" />
      <rect x="-70" y="-55" width="140" height="38" rx="14" fill="#020617" stroke="#00D284" stroke-width="1.5" />
      <text x="0" y="-30" text-anchor="middle" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-weight="900" font-size="16">San Francisco 24°</text>
    </g>

    <!-- Map Radar Controls (Layer Pills) -->
    <g transform="translate(24, 24)">
      <rect x="0" y="0" width="110" height="42" rx="21" fill="#0EA5E9" />
      <text x="55" y="26" text-anchor="middle" fill="#020617" font-family="'Outfit', sans-serif" font-weight="900" font-size="15">🌧️ Rain</text>

      <rect x="120" y="0" width="110" height="42" rx="21" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1" />
      <text x="175" y="26" text-anchor="middle" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-weight="700" font-size="15">💨 Wind</text>

      <rect x="240" y="0" width="110" height="42" rx="21" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1" />
      <text x="295" y="26" text-anchor="middle" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-weight="700" font-size="15">☁️ Clouds</text>
    </g>

    <!-- Radar Playback Bar (Bottom of Map) -->
    <g transform="translate(24, 880)">
      <rect x="0" y="0" width="672" height="76" rx="28" fill="rgba(2, 6, 23, 0.9)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" />
      <circle cx="48" cy="38" r="22" fill="#0EA5E9" />
      <polygon points="44,28 58,38 44,48" fill="#020617" />
      <text x="90" y="44" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-weight="800" font-size="18">10:00 AM • Live Radar Loop</text>
      <!-- Timeline Bar -->
      <line x1="320" y1="38" x2="640" y2="38" stroke="rgba(255, 255, 255, 0.2)" stroke-width="6" stroke-linecap="round" />
      <line x1="320" y1="38" x2="560" y2="38" stroke="#0EA5E9" stroke-width="6" stroke-linecap="round" />
      <circle cx="560" cy="38" r="10" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Doppler Legend Card -->
  <g transform="translate(40, 1180)" filter="url(#shadow)">
    <rect x="0" y="0" width="720" height="110" rx="28" fill="url(#glassCard)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />
    <text x="28" y="38" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-weight="800" font-size="18">Precipitation Intensity Spectrum</text>
    <rect x="28" y="55" width="664" height="18" rx="9" fill="url(#mapBg)" />
    <!-- Gradient Spectrum Bar -->
    <rect x="28" y="55" width="130" height="18" rx="9" fill="#22C55E" />
    <rect x="158" y="55" width="130" height="18" fill="#EAB308" />
    <rect x="288" y="55" width="130" height="18" fill="#F97316" />
    <rect x="418" y="55" width="130" height="18" fill="#EF4444" />
    <rect x="548" y="55" width="144" height="18" rx="9" fill="#A855F7" />

    <text x="28" y="94" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14">Light (0.1 mm/h)</text>
    <text x="360" y="94" text-anchor="middle" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14">Moderate (4 mm/h)</text>
    <text x="692" y="94" text-anchor="end" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14">Heavy Hail / Storm (&gt;20 mm/h)</text>
  </g>

  <!-- Floating Dock -->
  <g transform="translate(60, 1430)" filter="url(#shadow)">
    <rect x="0" y="0" width="680" height="96" rx="48" fill="url(#dockGlass)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="2" />
    <g transform="translate(170, 16)">
      <rect x="0" y="0" width="100" height="64" rx="32" fill="rgba(14, 165, 233, 0.25)" stroke="#0EA5E9" stroke-width="1.5" />
      <circle cx="50" cy="24" r="10" fill="none" stroke="#0EA5E9" stroke-width="3" />
      <text x="50" y="52" text-anchor="middle" fill="#0EA5E9" font-family="'Outfit', sans-serif" font-weight="900" font-size="15">Radar</text>
    </g>
  </g>
</svg>
