name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  release:
    types: [published, created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Prepare Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            echo "Android directory not found. Adding Capacitor Android platform..."
            npx cap add android
          fi
          npx cap sync android

      - name: Set execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate and Prepare APK
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: APK file was not generated!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" ./WeatherApp-release.apk
          ls -lh ./WeatherApp-release.apk

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WeatherApp-Android-APK
          path: ./WeatherApp-release.apk
          retention-days: 30

      - name: Publish or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          tag_name: latest
          name: "Latest Android APK Release"
          body: |
            ### 📱 Weather App Android APK
            
            This APK was built automatically by GitHub Actions CI/CD.
            
            #### How to Install:
            1. Download `WeatherApp-release.apk` below directly to your Android device.
            2. Open the downloaded file to install.
            3. If prompted, allow "Install from Unknown Sources" in your phone settings.
          prerelease: false
          draft: false
          files: ./WeatherApp-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
