name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - '*'
  release:
    types: [published, created, edited]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Build Web Application
        run: npm run build

      - name: Setup & Sync Capacitor Android
        run: |
          # 1. If android platform directory does not exist, add it
          if [ ! -d "android" ]; then
            echo "Android platform directory not found. Adding platform..."
            npx cap add android
          fi

          # 2. Restore any missing Android project template files (Gradle wrapper, variables, res values)
          echo "Restoring any missing Gradle wrapper and project template files from @capacitor/cli..."
          tar -xzf node_modules/@capacitor/cli/assets/android-template.tar.gz -C android --skip-old-files || true

          # 3. Ensure strings.xml has correct WeatherApp config
          mkdir -p android/app/src/main/res/values
          printf '%s\n' \
            "<?xml version='1.0' encoding='utf-8'?>" \
            "<resources>" \
            "    <string name=\"app_name\">WeatherApp</string>" \
            "    <string name=\"title_activity_main\">WeatherApp</string>" \
            "    <string name=\"package_name\">com.liveweather.app</string>" \
            "    <string name=\"custom_url_scheme\">com.liveweather.app</string>" \
            "</resources>" > android/app/src/main/res/values/strings.xml

          # 4. Synchronize compiled web assets and plugins into the Android project
          echo "Running Capacitor sync..."
          npx cap sync android

          # 5. Verify gradlew exists and grant execution permissions
          if [ ! -f "android/gradlew" ]; then
            echo "::error::android/gradlew could not be found or generated in the runner!"
            ls -la android || true
            exit 1
          fi

          chmod +x android/gradlew
          echo "android/gradlew is verified and executable."

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Build Android APK via Gradle
        run: |
          cd android
          echo "Building Release APK with Gradle..."
          if ./gradlew assembleRelease --no-daemon --stacktrace; then
            echo "Successfully built Release APK."
          else
            echo "assembleRelease failed or keystore unconfigured. Falling back to assembleDebug..."
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Verify APK Existence & Integrity
        id: verify_apk
        run: |
          APK_FILE=$(find android/app/build/outputs/apk/release/ -name "*.apk" -type f ! -name "*unsigned*" 2>/dev/null | head -n 1)
          if [ -z "$APK_FILE" ] || [ ! -s "$APK_FILE" ]; then
            echo "No signed release APK found, checking for any release APK..."
            APK_FILE=$(find android/app/build/outputs/apk/release/ -name "*.apk" -type f 2>/dev/null | head -n 1)
          fi
          if [ -z "$APK_FILE" ] || [ ! -s "$APK_FILE" ]; then
            echo "No release APK found, checking debug APK output..."
            APK_FILE=$(find android/app/build/outputs/apk/debug/ -name "*.apk" -type f 2>/dev/null | head -n 1)
          fi

          if [ -z "$APK_FILE" ] || [ ! -s "$APK_FILE" ]; then
            echo "::error::Build failed to generate a non-empty APK file!"
            exit 1
          fi

          FILE_SIZE=$(stat -c%s "$APK_FILE" 2>/dev/null || stat -f%z "$APK_FILE" 2>/dev/null || echo "0")
          if [ "$FILE_SIZE" -le 1000 ]; then
            echo "::error::Generated APK is suspiciously small (${FILE_SIZE} bytes)!"
            exit 1
          fi

          echo "APK successfully verified at: $APK_FILE (Size: ${FILE_SIZE} bytes)"
          cp "$APK_FILE" ./WeatherApp-release.apk
          ls -lh ./WeatherApp-release.apk

      - name: Upload APK as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WeatherApp-Android-APK
          path: ./WeatherApp-release.apk
          retention-days: 30

      - name: Attach APK to Tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ./WeatherApp-release.apk
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish or Update Rolling 'latest' Release
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name != 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Android APK Release"
          body: |
            ### 📱 Weather App - Installable Android APK
            
            This APK was built and verified automatically by GitHub Actions CI/CD.
            
            #### How to Install:
            1. Download `WeatherApp-release.apk` below directly to your Android device.
            2. Tap the downloaded file to install.
            3. If prompted by Android, enable **Install from unknown sources** for your browser or file manager.
          prerelease: false
          draft: false
          files: ./WeatherApp-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
